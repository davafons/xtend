<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xtend Capture options</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <h1><span class="wordmark">Xtend</span> Capture</h1>
  <p class="muted">Copies the responses x.com already loads for timelines, search, profiles, threads, likes, bookmarks, and follow lists, and sends them to Xtend. It never sends requests to X and never reads DMs.</p>
  <label>Xtend address <input id="xtendUrl" type="url" placeholder="https://xtend.localhost" required></label>
  <label>Capture token <input id="token" type="password" placeholder="xtend_capture_…" autocomplete="off"></label>
  <p class="muted">Create the token in Xtend under X data → Browser capture.</p>
  <div class="row">
    <button id="save" class="primary">Save and test</button>
  </div>
  <p id="message"></p>
  <script src="options.js" type="module"></script>
</body>
</html>
