version: 1
project: xtend

services:
  web:
    command: bin/rails server -p $PORT -b 127.0.0.1
    http:
      healthcheck: /up
  css:
    command: bin/rails tailwindcss:watch[always]

hooks:
  setup:
    command: bundle check
  prestart:
    command: bin/rails db:prepare && bin/rails tailwindcss:build

data:
  sqlite: [development.sqlite3]

tasks:
  console:
    command: bin/rails console
  test:
    command: bin/rails test
    timeout_seconds: 900
