# Deploy Xtend to your own server with Kamal: one Linux host with Docker and SSH access. See docs/deploy.md.
#
#   XTEND_SERVER=203.0.113.10 XTEND_HOST=xtend.example.com bin/kamal setup
#
# Secrets come from .kamal/secrets (read from your environment). For a second setup, add a destination:
# config/deploy.<name>.yml and .kamal/secrets.<name> (both gitignored), then bin/kamal deploy -d <name>.
<% host = ENV.fetch("XTEND_HOST", "xtend.example.com") %>
service: xtend
image: xtend

servers:
  web:
    - <%= ENV.fetch("XTEND_SERVER", "203.0.113.10") %>

ssh:
  user: <%= ENV.fetch("XTEND_SSH_USER", "root") %>

# Kamal runs a registry on your machine and the server pulls through the SSH tunnel, so no registry account is needed.
registry:
  server: localhost:5555

builder:
  arch: amd64

# kamal-proxy gets a Let's Encrypt certificate for the host. Point its DNS at the server first.
proxy:
  ssl: true
  host: <%= host %>
  app_port: 3000
  healthcheck:
    path: /up

env:
  secret:
    - SECRET_KEY_BASE
    - X_CLIENT_ID
    - X_CLIENT_SECRET
  clear:
    APP_HOSTS: <%= host %>
    X_REDIRECT_URI: https://<%= host %>/x/connection/callback

# Both SQLite databases and the X token key live here. Back this volume up.
volumes:
  - xtend_data:/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  allow: app exec --reuse "bin/rails users:allow"
