# the server stack. The existing infra tunnel (cloudflared on the host network) routes the public
# hostname to http://localhost:23010, so the app publishes only that loopback port.
# Build first: docker build --build-context lostcoords-ui=../lostcoords-ui -t twitter-crm .
# APP_HOSTS and SECRET_KEY_BASE come from the deployment environment, never from this repo.
services:
  web:
    image: twitter-crm
    container_name: twitter-crm
    restart: unless-stopped
    ports:
      - "127.0.0.1:23010:3000"
    environment:
      APP_HOSTS: ${APP_HOSTS:?set APP_HOSTS}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
    volumes:
      - twitter-crm-data:/data

volumes:
  twitter-crm-data:
